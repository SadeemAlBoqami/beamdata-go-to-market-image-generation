global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # These exporters already run on aidc-t09. host-gateway reaches the Docker host.
  - job_name: dcgm
    static_configs:
      - targets: ["host.docker.internal:9400"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # vLLM-Omni may expose native request metrics here; no custom metrics are added.
  - job_name: flux
    static_configs:
      - targets: ["flux:8000"]

  - job_name: zimage
    static_configs:
      - targets: ["zimage:8000"]
