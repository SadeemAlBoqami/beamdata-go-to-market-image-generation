spec:
  template:
    spec:
      containers:
        - name: nvidia-device-plugin-ctr

          env:
            - name: CONFIG_FILE
              value: /config/config.yaml

          volumeMounts:
            - name: nvidia-device-plugin-config
              mountPath: /config
              readOnly: true

      volumes:
        - name: nvidia-device-plugin-config
          configMap:
            name: nvidia-device-plugin-config
