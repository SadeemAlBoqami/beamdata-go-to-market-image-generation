apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gradio
  namespace: beamdata
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gradio
                port:
                  number: 7860
