apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gradio-strip-prefix
  namespace: beamdata
spec:
  stripPrefix:
    prefixes:
      - /proxy/7860
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gradio
  namespace: beamdata
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gradio
                port:
                  number: 7860
