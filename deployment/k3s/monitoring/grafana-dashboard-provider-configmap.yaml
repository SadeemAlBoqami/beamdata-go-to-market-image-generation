apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: Beamdata
        folder: Beamdata
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
