apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      - job_name: dcgm
        static_configs:
          - targets: ["10.0.0.144:9400"]

      - job_name: node
        static_configs:
          - targets: ["10.0.0.144:9100"]

      - job_name: flux
        static_configs:
          - targets: ["flux2-klein.beamdata.svc.cluster.local:8000"]

      - job_name: zimage
        static_configs:
          - targets: ["z-image-turbo.beamdata.svc.cluster.local:8000"]
