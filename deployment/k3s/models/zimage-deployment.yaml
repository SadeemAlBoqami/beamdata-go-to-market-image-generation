apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-image-turbo
  namespace: beamdata
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: z-image-turbo
  template:
    metadata:
      labels:
        app: z-image-turbo
    spec:
      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: z-image-turbo
          image: ghcr.io/sadeemalboqami/z-image-turbo@sha256:df5666d0f63f113d927376f7aa90b98e75807903009c06bb38d2b8f7c7315615
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: model-tokens
                  key: zimage-token

            - name: HF_HOME
              value: /var/lib/hf-cache

            - name: HF_HUB_OFFLINE
              value: "1"

          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1

          volumeMounts:
            - name: hf-cache
              mountPath: /var/lib/hf-cache

          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, urllib.request
                  req = urllib.request.Request(
                      "http://127.0.0.1:8000/health",
                      headers={"Authorization": "Bearer " + os.environ["API_TOKEN"]}
                  )
                  urllib.request.urlopen(req, timeout=5)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 20

          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, urllib.request
                  req = urllib.request.Request(
                      "http://127.0.0.1:8000/health",
                      headers={"Authorization": "Bearer " + os.environ["API_TOKEN"]}
                  )
                  urllib.request.urlopen(req, timeout=5)
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: hf-cache
          hostPath:
            path: /var/lib/hf-cache
            type: Directory
